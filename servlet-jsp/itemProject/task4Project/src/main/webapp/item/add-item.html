<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>ADD Item</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
 <link rel="stylesheet" href="css/add-item.css">
 
 

</head>
<body>
<!-- partial:index.partial.html -->
<div class="container">
  <div class="text">
    Add Item
  </div>
  <form action="/ItemService/ItemController" method="get">
    <div class="form-row">
      <div class="input-data">
        <input type="text" required name="name">
        <div class="underline"></div>
        <label>Name</label>
      </div>
      <div class="input-data">
        <input type="text" required name="price">
        <div class="underline"></div>
        <label>PRICE</label>
      </div>
    </div>
    <div class="form-row">
      <div class="input-data">
        <input type="number" required name="totalNumber">
        <div class="underline"></div>
        <label>TOTAL_NUMBER</label>
      </div>

    </div>
    <input type="hidden" required name="action" value = "add-item">
    <input type="submit" value="Add" class="button">
  </form>
  
  <p class="back">
    <a href="/ItemService/ItemController" >Back To Items</a>
  </p>
</div>

<script>
     if (request.getAttribute("message") != null) { 
        alert('<%= request.getAttribute("message") %>');
     } 
</script>
<!-- partial -->

</body>
</html>
