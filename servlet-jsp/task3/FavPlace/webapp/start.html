<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Select Favorite Place</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #6dd5fa, #2980b9);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }
    form {
        background-color: #fff;
        padding: 30px 25px;
        border-radius: 15px;
        box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
        width: 350px;
        text-align: center;
    }
    label {
        display: block;
        font-size: 18px;
        margin-bottom: 15px;
        color: #333;
    }
    select, input[type="submit"] {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
    }
    select:focus {
        border-color: #2980b9;
        box-shadow: 0 0 5px #2980b9;
        outline: none;
    }
    input[type="submit"] {
        background-color: #2980b9;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }
    input[type="submit"]:hover {
        background-color: #1f618d;
    }
</style>
</head>
<body>
<form action="saveFavPlace.jsp" method="get">
    <label>Select your favorite place:</label>
    <select name="favPlace" required>
        <option value="">--Select--</option>
        <option value="Cairo">Cairo</option>
        <option value="Alexandria">Alexandria</option>
        <option value="Luxor">Luxor</option>
        <option value="Aswan">Aswan</option>
        <option value="Sharm El-Sheikh">Sharm El-Sheikh</option>
    </select>
    <input type="submit" value="Save">
</form>
</body>
</html>
