<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Form</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    form {
        background: #fff;
        padding: 30px 35px;
        width: 350px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #333;
    }

    input[type="text"],
    input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 20px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        transition: border 0.3s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
        outline: none;
        border-color: #667eea;
    }

    input[type="submit"] {
        width: 100%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s, transform 0.2s;
    }

    input[type="submit"]:hover {
        background: #5a6fe3;
        transform: translateY(-2px);
    }
</style>

</head>
<body>

    <form action="showStudent.jsp">
        <label>Name</label>
        <input type="text" name="name" placeholder="Enter your name">

        <label>Age</label>
        <input type="number" name="age" placeholder="Enter your age">

        <input type="submit" value="Submit">
    </form>

</body>
</html>
